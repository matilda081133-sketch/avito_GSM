name: 24/7 Keep-Alive Pinger

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          echo "Pinging Avito GSM on Render..."
          curl -s -f https://avito-gsm.onrender.com || echo "Ping attempted"
